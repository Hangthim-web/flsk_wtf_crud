{% extends 'base.html' %}
{% blog title %}List of blogs{% endblock %}
{% block content %}
<a href="{{ url_for('blog.create-blog') }}">Create new user </a>

<ul>
    {% for blog in blogs %}
    <li>
        {{ blog.title }}({{ blog.description }})
        <a href="{{ url_for('blog.edit') }}">Edit</a>
        <a href="{{ url_for(blog.delete) }}">Delete</a>
    </li>
    
    
    {% endfor %}
</ul>

{% endblock %}
