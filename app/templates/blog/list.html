{% extends 'base.html' %}
{% block title %}List of blogs{% endblock %}
{% block content %}
<a href="{{ url_for('blog.create') }}">Create New Blog </a>

<ul>
    {% for blog in blogs %}
    <li>
        {{ blog.title }}({{ blog.description }})
        <a href="{{ url_for('blog.edit_blog',blog_id=blog.id) }}">Edit</a>
       
        <form action="{{ url_for('blog.delete_blog_route', blog_id=blog.id) }}" 
      method="POST" 
      style="display:inline;"
      onsubmit="return confirm('Are you sure you want to delete this blog?');">
    <button type="submit">Delete</button>
</form>
</li>
    {% endfor %}
</ul>

{% endblock %}
